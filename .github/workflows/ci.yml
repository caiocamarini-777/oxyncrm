name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-db
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  # Projeto Supabase só de testes (oxyncrm-testes). O banco é recriado a cada execução; ver scripts/ci-db-reset.ts.
  SUPABASE_TEST_PROJECT_REF: cvqaaipjdirbbwfdgjox

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cadastro aberto desligado no Supabase
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: pnpm check:auth
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Recria o banco de testes
        if: env.SUPABASE_DB_URL != ''
        run: pnpm ci:db-reset
      - name: Testes de banco
        if: env.SUPABASE_DB_URL != ''
        run: pnpm test:db
      - run: pnpm build
      - name: Playwright
        if: env.SUPABASE_DB_URL != ''
        run: pnpm exec playwright install --with-deps chromium
      # O reset roda com --no-seed: os e2e precisam do admin@oxyn.test e das empresas oxyn e volt.
      - name: Seed dos e2e
        if: env.SUPABASE_DB_URL != ''
        run: pnpm db:seed
      - name: E2E
        if: env.SUPABASE_DB_URL != ''
        run: pnpm test:e2e
        env:
          # valor fixo só do CI: o next dev dos e2e envia e-mail para o arquivo .e2e-outbox
          CRON_SECRET: segredo-dos-e2e
