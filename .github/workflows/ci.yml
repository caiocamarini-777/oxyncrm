name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cada execução tem o próprio Supabase (descartável, dentro do runner): execuções em paralelo não se atrapalham.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Supabase local em Docker, com as migrations desta branch. Nada aqui toca a produção nem o banco de testes
      # do site (oxyncrm-testes), que é atualizado pelo workflow banco-testes.yml.
      - name: Sobe o Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Variáveis do Supabase local
        run: |
          pnpm exec supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_URL)=' \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Cadastro aberto desligado no Supabase
        run: pnpm check:auth
      - name: Testes de banco
        run: pnpm test:db
      - run: pnpm build
      - name: Playwright
        run: pnpm exec playwright install --with-deps chromium
      # O Supabase local sobe sem dados (não há supabase/seed.sql): os e2e precisam do admin@oxyn.test e das
      # empresas oxyn e volt.
      - name: Seed dos e2e
        run: pnpm db:seed
      - name: E2E
        run: pnpm test:e2e
        env:
          # valor fixo só do CI: o next dev dos e2e envia e-mail para o arquivo .e2e-outbox
          CRON_SECRET: segredo-dos-e2e
